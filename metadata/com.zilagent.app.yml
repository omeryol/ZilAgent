AutoName: ZilAgent
Summary: Offline school bell schedules, countdown and widgets.
Description: |
    ZilAgent helps teachers and schools track bell schedules with a clear, offline-first workflow.

    Features:

    * Fully offline architecture (no internet permission).
    * Profile-based schedules (normal day, exam day, weekend course).
    * Live Countdown widget and Lesson Flow widget.
    * Fullscreen Exam Mode timer for classroom visibility.
    * Local backup/restore and QR profile transfer.
    * Turkish and English interface support.

